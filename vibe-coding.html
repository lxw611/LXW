<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人 Vibe Coding 作品</title>
  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: var(--sans);
      min-width: 320px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      padding: 80px 8vw 64px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .back:hover {
      opacity: 1;
    }

    header {
      margin: 96px 0 72px;
      border-bottom: 1px solid var(--white);
      padding-bottom: 40px;
    }

    header p {
      margin: 0 0 24px;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.72;
    }

    header h1 {
      margin: 0;
      max-width: 13ch;
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .project-list {
      display: flex;
      flex-direction: column;
    }

    .project {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 26px;
      align-items: baseline;
      padding: 34px 0;
      border-top: 1px solid var(--white);
      transition: color 160ms ease, background 160ms ease;
    }

    .project:last-child {
      border-bottom: 1px solid var(--white);
    }

    .project:hover {
      background: var(--white);
      color: var(--black);
    }

    .project-index {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
    }

    .project h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .project p {
      margin: 12px 0 0;
      max-width: 620px;
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .project-arrow {
      font-family: var(--mono);
      font-size: 20px;
    }

    footer {
      margin-top: 72px;
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    @media (max-width: 760px) {
      .page {
        padding: 28px 22px 56px;
      }

      header {
        margin: 72px 0 48px;
      }

      header h1 {
        font-size: 2.7rem;
      }

      .project {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .project-arrow {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← BACK</a>

    <header>
      <p>PERSONAL / VIBE CODING</p>
      <h1>个人 Vibe Coding 作品</h1>
    </header>

    <div class="project-list">
      <a class="project" href="https://lxw611.github.io/xianxia-skill-showcase/" target="_blank" rel="noreferrer">
        <div class="project-index">01</div>
        <div>
          <h2>Xianxia Skill Showcase</h2>
          <p>仙侠技能展示：围绕角色技能与东方幻想视觉，构建的沉浸式网页交互作品。</p>
        </div>
        <div class="project-arrow">→</div>
      </a>

      <a class="project" href="https://lxw611.github.io/deep-dream-gallery/" target="_blank" rel="noreferrer">
        <div class="project-index">02</div>
        <div>
          <h2>Deep Dream Gallery</h2>
          <p>深梦画廊：以梦境般的生成视觉和连续浏览体验，呈现一组实验性的数字画廊。</p>
        </div>
        <div class="project-arrow">→</div>
      </a>

      <a class="project" href="https://lxw611.github.io/bosideng-web-animation/" target="_blank" rel="noreferrer">
        <div class="project-index">03</div>
        <div>
          <h2>Bosideng Web Animation</h2>
          <p>波司登网页动画：通过滚动叙事与动态视觉，展现品牌质感与产品细节。</p>
        </div>
        <div class="project-arrow">→</div>
      </a>
    </div>

    <footer>LXW / PERSONAL WORKS / 2026</footer>
  </main>
</body>
</html>
